name: Quanh Lab - Xuất đủ 300 ảnh Vật lí 2D
on:
  push:
    branches: [feat/scientific-illustrations-v41]
    paths:
      - scripts/generate-scientific-thumbnails.mjs
      - scripts/validate-300-thumbnails.py
      - .github/workflows/produce-300-physics-thumbnails.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: physics-300-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check Pillow cairosvg
      - name: Generate 300 scientific SVG illustrations from catalog
        run: node scripts/generate-scientific-thumbnails.mjs
      - name: Validate dimensions, visual uniqueness and export WebP
        run: python scripts/validate-300-thumbnails.py
      - name: Assert exactly 300 SVG and 300 WebP files
        shell: bash
        run: |
          count_svg=$(find dist/images/thumbnails-2d -maxdepth 1 -name '*.svg' | wc -l)
          count_webp=$(find dist/images/thumbnails-2d -maxdepth 1 -name '*.webp' | wc -l)
          echo "SVG=$count_svg WebP=$count_webp"
          test "$count_svg" -eq 300
          test "$count_webp" -eq 300
      - uses: actions/upload-artifact@v4
        with:
          name: QuanhLab-300-Physics-2D-Images
          path: |
            dist/images/thumbnails-2d/
          retention-days: 30
      - name: Save 300 images to GitHub branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/images/thumbnails-2d/
          if ! git diff --cached --quiet; then
            git commit -m "assets(science): publish 300 validated 2D SVG and WebP images [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
