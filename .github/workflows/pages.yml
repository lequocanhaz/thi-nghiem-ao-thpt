name: Kiểm tra và xuất bản website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned KaTeX for math validation
        run: npm install --ignore-scripts --no-save --package-lock=false katex@0.16.45
      - name: Check public assets and browser security requirements
        run: node checks/site-security-v63.mjs
      - run: npm run check
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle KaTeX locally, including mathematical fonts
        run: |
          npm install --no-save --ignore-scripts --package-lock=false katex@0.16.45
          mkdir -p dist/vendor/katex/fonts
          cp node_modules/katex/dist/katex.min.js dist/vendor/katex/katex.min.js
          cp node_modules/katex/dist/katex.min.css dist/vendor/katex/katex.min.css
          cp -R node_modules/katex/dist/fonts/. dist/vendor/katex/fonts/
          test -s dist/vendor/katex/katex.min.js
          test -s dist/vendor/katex/fonts/KaTeX_Main-Regular.woff2
      - name: Refuse accidental public credentials
        run: node scripts/check-public-assets.mjs
      - name: Apply browser security policy to all HTML pages
        run: |
          node scripts/harden-published-pages.mjs --write
          node scripts/harden-published-pages.mjs --verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Xuất bản GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
