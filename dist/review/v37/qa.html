<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quanh Lab · Kiểm tra giao diện</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;color:#111;background:#e9ebef}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:3;padding:12px 16px;background:white;border-bottom:1px solid #ccd2dc}button,select{height:38px;border:1px solid #bcc4d1;border-radius:7px;padding:0 12px;background:white;color:#111;font:inherit}button{cursor:pointer}#run{background:#111;color:white;border-color:#111}#status{margin-left:auto}#viewport{padding:16px;overflow:auto}iframe{display:block;width:390px;height:860px;border:0;background:white;margin:auto;box-shadow:0 2px 16px #0001}pre{padding:16px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere;margin:16px}h1{font-size:14px;margin:0 8px 0 0}a{color:#111}#failures{max-height:300px;overflow:auto}</style>
<header><h1>Quanh Lab · Kiểm tra bố cục</h1><label>Rộng <select id="width"><option>320</option><option selected>390</option><option>620</option><option>768</option><option>1024</option><option>1280</option><option>1440</option></select></label><label>Phần <select id="route"><option value="">Trang chủ</option><option value="#library">Thư viện</option><option value="#lab/energy">Cơ năng</option><option value="#lab/electric">Điện trường</option><option value="#lab/ohm">Định luật Ohm</option><option value="#lab/wave">Sóng</option></select></label><button id="inspect">Đo bố cục</button><label><input type="checkbox" id="exercise" checked> Chạy & ghi điểm</label><button id="run">Kiểm tra 300 bài × 4 khung</button><button id="stop" disabled>Dừng</button><span id="status" role="status">Sẵn sàng</span></header>
<div id="viewport"><iframe id="frame" src="../../index.html?v=37" title="Quanh Lab trong khung kiểm tra"></iframe></div><pre id="summary">Chọn khung hoặc chạy kiểm tra. Dữ liệu nằm trong phiên trình duyệt kiểm tra này.</pre><pre id="failures"></pre><details><summary>Báo cáo đầy đủ</summary><pre id="report">Chưa chạy</pre></details>
<script type="module">
import {experiments} from '../../experiments.js?v=17';
const $=s=>document.querySelector(s),f=$('#frame');let stopped=false,report={started:null,completed:null,cases:[],failures:[]};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function size(w){f.style.width=w+'px';$('#width').value=String(w)}
async function ready(id){const deadline=Date.now()+20000;while(Date.now()<deadline){let d=f.contentDocument;if(d?.querySelector(id?'#lessonTitle':'.home')&&(!id||d.querySelector('#labSelect')?.value===id)){await d.fonts.ready;await new Promise(r=>f.contentWindow.requestAnimationFrame(()=>f.contentWindow.requestAnimationFrame(r)));return d;}await wait(50);}throw Error('Route not ready: '+id)}
function audit(d,label){const w=d.documentElement.clientWidth,errors=[],rect=e=>e.getBoundingClientRect();const visible=e=>{const r=rect(e);return r.width>0&&r.height>0&&!e.closest('[hidden]')};
 if(d.documentElement.scrollWidth>w+1)errors.push({issue:'page-overflow',actual:d.documentElement.scrollWidth,expected:w});
 for(const e of d.querySelectorAll('.header,.home,.lab,.stage-shell,.controls,.card-actions,.lab-navigation'))if(visible(e)){const r=rect(e);if(r.right>w+1||r.left<-.5)errors.push({issue:'container-outside',selector:e.className,left:r.left,right:r.right,width:w});}
 for(const e of d.querySelectorAll('.card-actions')){const buttons=[...e.children].filter(visible);if(buttons.length===2){const [a,b]=buttons.map(rect);if(Math.abs(a.top-b.top)>.75||Math.abs(a.height-b.height)>.75)errors.push({issue:'card-button-alignment',a:{top:a.top,height:a.height},b:{top:b.top,height:b.height}});}}
 for(const e of d.querySelectorAll('.banner-expand,.stage-tools .icon-button,.favorite-button'))if(visible(e)){const r=rect(e);if(Math.abs(r.width-r.height)>.75)errors.push({issue:'icon-not-square',selector:e.className,width:r.width,height:r.height});const svg=e.querySelector('svg');if(svg){const q=rect(svg);if(Math.abs(q.x+q.width/2-r.x-r.width/2)>.75||Math.abs(q.y+q.height/2-r.y-r.height/2)>.75)errors.push({issue:'icon-not-centered',selector:e.className,dx:q.x+q.width/2-r.x-r.width/2,dy:q.y+q.height/2-r.y-r.height/2});}}
 for(const e of d.querySelectorAll('.card-open,.preview-button,.transport button,.header nav>a,.header nav>button,.lab-navigation button'))if(visible(e)){const r=rect(e);if(r.height<43.5)errors.push({issue:'short-button',label:e.textContent.trim(),height:r.height});if(e.scrollWidth>e.clientWidth+1)errors.push({issue:'button-content-overflow',label:e.textContent.trim(),scroll:e.scrollWidth,client:e.clientWidth});}
 return {label,width:w,errorCount:errors.length,errors};}
function show(result){$('#summary').textContent=JSON.stringify(result,null,2)}
$('#width').onchange=()=>size($('#width').value);$('#route').onchange=()=>f.contentWindow.location.hash=$('#route').value;
$('#inspect').onclick=async()=>{await ready($('#route').value.startsWith('#lab/')?$('#route').value.slice(5):null);show(audit(f.contentDocument,'manual'))};
$('#stop').onclick=()=>{stopped=true};
$('#run').onclick=async()=>{
 if($('#run').disabled)return;
 const exercise=$('#exercise').checked;
 stopped=false;
 report={started:new Date().toISOString(),completed:null,page:new URL(f.src,location.href).href,exercise,cases:[],failures:[]};
 $('#run').disabled=true;$('#stop').disabled=false;$('#exercise').disabled=true;
 const capture=(d,route,width,phase)=>{
  const a=audit(d,route);
  report.cases.push({route,viewportWidth:width,clientWidth:a.width,phase,errorCount:a.errorCount});
  report.failures.push(...a.errors.map(q=>({route,width,phase,...q})));
  $('#status').textContent=report.cases.length+' trạng thái · '+report.failures.length+' lỗi';
  $('#summary').textContent=JSON.stringify({started:report.started,cases:report.cases.length,failures:report.failures.length,current:{route,width,phase}},null,2);
  $('#failures').textContent=JSON.stringify(report.failures.slice(0,30),null,2);
 };
 try{
  for(const width of [320,390,768,1280]){
   size(width);f.contentWindow.location.hash='';await ready(null);capture(f.contentDocument,'home',width,'ready');
   for(const e of experiments){
    if(stopped)break;
    f.contentWindow.location.hash='#lab/'+e.id;
    const d=await ready(e.id);
    d.querySelector('[data-mode="explore"]')?.click();
    capture(d,e.id,width,'ready');
    if(exercise){
     const play=d.querySelector('#play');
     if(!play||play.hidden)throw Error('Missing play control: '+e.id);
     play.click();await wait(450);
     capture(d,e.id,width,'running');
     if(play.getAttribute('aria-pressed')==='true')play.click();
     const count=()=>Number(d.querySelector('[data-measurement-count]')?.textContent||0);
     const before=count();
     d.querySelector('.transport [data-action="record"]').click();await wait(200);
     capture(d,e.id,width,'recorded');
     if(count()!==before+1)report.failures.push({route:e.id,width,phase:'recorded',issue:'record-count',before,after:count()});
     else{
      d.querySelector('[data-action="undo"]').click();
      if(count()!==before)report.failures.push({route:e.id,width,phase:'cleanup',issue:'undo-count',before,after:count()});
     }
     d.querySelector('[data-mode="explore"]')?.click();
    }
   }
   if(stopped)break;
  }
  report.completed=new Date().toISOString();report.stopped=stopped;
  $('#report').textContent=JSON.stringify(report,null,2);
  show({started:report.started,completed:report.completed,cases:report.cases.length,failures:report.failures.length,exercise,stopped});
  $('#failures').textContent=JSON.stringify(report.failures,null,2);
  $('#status').textContent=stopped?'Đã dừng':'Hoàn tất';
 }catch(error){
  report.error=error.message;$('#report').textContent=JSON.stringify(report,null,2);
  $('#status').textContent='Lỗi kiểm tra';show({error:error.message,cases:report.cases.length,failures:report.failures.slice(0,20)});
 }finally{$('#run').disabled=false;$('#stop').disabled=true;$('#exercise').disabled=false;}
};
</script></html>
