<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quanh Lab · Kiểm tra sách</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8e9ec;color:#111;font:14px/1.5 system-ui}header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px;background:#fff;position:sticky;top:0;z-index:2}h1{font-size:15px;margin:0}select{height:40px;font:inherit;background:#fff;border:1px solid #bbb;border-radius:7px;padding:0 10px}main{padding:16px;overflow:auto}iframe{display:block;border:0;width:390px;height:860px;margin:auto;background:#fff;box-shadow:0 4px 20px #0002}</style>
<header><h1>Kiểm tra sách</h1><label>Rộng <select id="width"><option>320</option><option>375</option><option selected>390</option><option>393</option><option>402</option><option>414</option><option>430</option><option>440</option><option>844</option><option>932</option><option>768</option><option>1280</option></select></label><label>Sách <select id="grade"><option value="">Thư viện sách</option><option value="10" selected>Vật lí 10</option><option value="11">Vật lí 11</option><option value="12">Vật lí 12</option></select></label></header><main><iframe id="bookFrame" title="Sách trong khung kiểm tra" src="about:blank"></iframe></main>
<script type="module">const frame=document.querySelector('iframe');function open(){const url=new URL('../books.html',location.href);url.searchParams.set('v','41');url.searchParams.set('qa',Date.now());const grade=document.querySelector('#grade').value;if(grade){url.searchParams.set('grade',grade);url.searchParams.set('page','1');}frame.src=url.href;}document.querySelector('#width').onchange=event=>frame.style.width=event.target.value+'px';document.querySelector('#grade').onchange=open;open();</script>
