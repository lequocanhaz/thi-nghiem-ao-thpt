[agents.ai]
description = "Chuyên gia trợ lý AI Quanh Lab, tích hợp backend, hiển thị LaTeX/KaTeX và bảo mật API."
config_file = "agents/ai.toml"

[agents.qa]
description = "Chuyên gia kiểm thử Quanh Lab, kiểm tra hồi quy, 300 thí nghiệm, sách lật ảo, AI và chất lượng trước phát hành."
config_file = "agents/qa.toml"
